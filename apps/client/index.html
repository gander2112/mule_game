<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M.U.L.E. Reborn</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #15161a;
        --panel: #1e2027;
        --panel-alt: #262935;
        --border: #3a3d4a;
        --text: #e8e8ef;
        --text-dim: #9b9db0;
        --accent: #f2c744;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      #app {
        display: flex;
        min-height: 100vh;
        flex-wrap: wrap;
      }
      #game {
        background: #0c0d10;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 16px;
      }
      #ui {
        flex: 1 1 360px;
        min-width: 340px;
        max-width: 480px;
        padding: 16px;
        border-left: 1px solid var(--border);
        overflow-y: auto;
        max-height: 100vh;
      }
      h1 {
        font-size: 1.1rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 12px;
      }
      h2 {
        font-size: 0.95rem;
        margin: 18px 0 8px;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px;
        margin-bottom: 12px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 2px 0;
        font-size: 0.9rem;
      }
      .row .label {
        color: var(--text-dim);
      }
      button {
        background: var(--panel-alt);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 6px 10px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.85rem;
      }
      button:hover:not(:disabled) {
        border-color: var(--accent);
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      button.primary {
        background: var(--accent);
        color: #1b1b1b;
        font-weight: 600;
        border-color: var(--accent);
      }
      input,
      select {
        background: var(--panel-alt);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 5px 7px;
        border-radius: 4px;
        font-size: 0.85rem;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 3px;
        margin-bottom: 8px;
      }
      .field label {
        font-size: 0.78rem;
        color: var(--text-dim);
      }
      .action-group {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      #log {
        font-size: 0.78rem;
        color: var(--text-dim);
        max-height: 220px;
        overflow-y: auto;
        display: flex;
        flex-direction: column-reverse;
      }
      #log div {
        padding: 2px 0;
        border-bottom: 1px solid var(--border);
      }
      .mule-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.85rem;
        padding: 4px 0;
        border-bottom: 1px solid var(--border);
      }
      .hint {
        font-size: 0.78rem;
        color: var(--accent);
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game"></div>
      <div id="ui"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
